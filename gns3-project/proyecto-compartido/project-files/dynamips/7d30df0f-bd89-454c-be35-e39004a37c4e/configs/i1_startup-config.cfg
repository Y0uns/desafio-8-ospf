!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 10.1.10.1 10.1.10.99
ip dhcp excluded-address 10.1.40.1 10.1.40.99
ip dhcp excluded-address 10.2.20.1 10.2.20.99
ip dhcp excluded-address 10.2.30.1 10.2.30.99
ip dhcp excluded-address 10.2.50.1 10.2.50.99
!
ip dhcp pool VLAN10-Santiago-Ventas
   network 10.1.10.0 255.255.255.0
   dns-server 10.1.100.10 
   domain-name technomarket.lan
   default-router 10.1.10.1 
!
ip dhcp pool VLAN20-Valparaiso
   network 10.2.20.0 255.255.255.0
   default-router 10.2.20.1 
   domain-name technomarket.lan
   dns-server 10.1.100.10 
!
ip dhcp pool VLAN30-Valparaiso
   network 10.2.30.0 255.255.255.0
   default-router 10.2.30.1 
   dns-server 10.1.100.10 
   domain-name technomarket.lan
!
ip dhcp pool VLAN50-Valparaiso
   network 10.2.50.0 255.255.255.0
   default-router 10.2.50.1 
   dns-server 10.1.100.10 
   domain-name technomarket.lan
!
ip dhcp pool VLAN40-Santiago-Soporte
   network 10.1.40.0 255.255.255.0
   default-router 10.1.40.1 
   dns-server 10.1.100.10 
   domain-name technomarket.lan
!
!
no ip domain lookup
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.1.10.1 255.255.255.0
!
interface FastEthernet0/0.40
 encapsulation dot1Q 40
 ip address 10.1.40.1 255.255.255.0
 ip access-group SOPORTE_NO_VENTAS in
!
interface FastEthernet0/0.100
 encapsulation dot1Q 100
 ip address 10.1.100.1 255.255.255.0
!
interface FastEthernet0/1
 ip address 10.255.12.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
!
interface FastEthernet1/1
!
interface FastEthernet1/2
!
interface FastEthernet1/3
!
interface FastEthernet1/4
!
interface FastEthernet1/5
!
interface FastEthernet1/6
!
interface FastEthernet1/7
!
interface FastEthernet1/8
!
interface FastEthernet1/9
!
interface FastEthernet1/10
!
interface FastEthernet1/11
!
interface FastEthernet1/12
!
interface FastEthernet1/13
!
interface FastEthernet1/14
!
interface FastEthernet1/15
!
interface Vlan1
 no ip address
!
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface FastEthernet0/0.10
 passive-interface FastEthernet0/0.40
 passive-interface FastEthernet0/0.100
 network 10.1.10.0 0.0.0.255 area 0
 network 10.1.40.0 0.0.0.255 area 0
 network 10.1.100.0 0.0.0.255 area 0
 network 10.255.12.0 0.0.0.3 area 0
!
!
!
no ip http server
no ip http secure-server
!
ip access-list extended SOPORTE_NO_VENTAS
 deny   ip 10.1.40.0 0.0.0.255 10.1.10.0 0.0.0.255
 permit ip any any
!
no cdp log mismatch duplex
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
